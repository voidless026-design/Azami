# Azami backend stack. From repo root:
#   docker compose -f deploy/docker-compose.yml up -d
#
# The API executes tools by launching pinned tool-runner containers via the Docker
# socket (runner_backend=docker). Build the runner images first (see runners/*/Dockerfile),
# e.g.:  for t in nmap gobuster hydra john metasploit tcpdump; do \
#          docker build -t azami/$t:latest runners/$t; done
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: azami
      POSTGRES_PASSWORD: azami
      POSTGRES_DB: azami
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azami"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      AZAMI_DATABASE_URL: postgresql+psycopg://azami:azami@db:5432/azami
      AZAMI_REDIS_URL: redis://redis:6379/0
      AZAMI_RATELIMIT_BACKEND: redis
      AZAMI_RUNNER_BACKEND: docker
      # Production: keep scopes signed.
      AZAMI_ALLOW_UNSIGNED_SCOPES: "false"
      # CHANGE THIS to a long random secret.
      AZAMI_JWT_SECRET: "change-me-to-a-long-random-secret"
      AZAMI_BOOTSTRAP_ADMIN_PASSWORD: "change-me"
    ports:
      - "8099:8099"
    volumes:
      # Lets the API launch tool-runner containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - wordlists:/app/backend/.azami_data/wordlists
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  wordlists:
