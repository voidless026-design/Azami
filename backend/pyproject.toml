[project]
name = "azami"
version = "0.1.0"
description = "Azami — authorized reconnaissance & OSINT platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "cryptography>=42.0",
    "httpx>=0.27",
    "dnspython>=2.6",
    "PyYAML>=6.0",
    "tldextract>=5.1",
    "phonenumbers>=8.13",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Production execution backends (in-process asyncio is the default and needs none of these).
prod = [
    "psycopg[binary]>=3.1",   # PostgreSQL
    "redis>=5.0",             # rate-limit state + Celery broker
    "celery>=5.3",            # distributed workers
    "alembic>=1.13",          # migrations
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.3",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = ["azami*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# B008: FastAPI's Depends()/Query() default-arg pattern is idiomatic, not a bug.
ignore = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
